name: Radar OLX
on:
  schedule:
    - cron: "0 * * * *" # Corre de hora em hora
  workflow_dispatch: # Permite que tu carregues num botão para testar agora mesmo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'
      - name: Instalar dependencias
        run: pip install requests
      - name: Correr o Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python radarolx.py
